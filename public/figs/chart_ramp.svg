<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="Pretendard,'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><path d="M286.8 200 L460 100" fill="none" stroke="#D93025" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M177.2 200 L460 100" fill="none" stroke="#E8710A" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M72.7 200 L460 100" fill="none" stroke="#1E8E3E" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><rect x="460" y="100" width="70" height="100" rx="0" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="2" /><line x1="470" y1="100" x2="470" y2="200" stroke="#3C4043" stroke-width="1.5" stroke-linecap="round" /><text x="480" y="156" font-size="13" font-weight="800" fill="#3C4043" text-anchor="start">높이 같음</text><line x1="20" y1="200" x2="540" y2="200" stroke="#3C4043" stroke-width="2" stroke-linecap="round" /><text x="30" y="40" font-size="15" font-weight="800" fill="#3C4043" text-anchor="start">빗면(쐐기)이 길수록 드는 힘은 작고, 밀어야 하는 거리는 길어져요.</text><text x="40" y="224" font-size="13" font-weight="700" fill="#5F6368" text-anchor="start">짧은 빗면 = 쐐기 각도 큼(45°)      긴 빗면 = 쐐기 각도 작음(15°)</text></svg>